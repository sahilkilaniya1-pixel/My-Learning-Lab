      // Q8. Write a function createListFromArray(arr, containerId) that dynamically creates <li> elements from an
      // array and appends them inside a container element.
      const createTableFromData = (data, containerId) => {
        if (!data || data.length === 0) return;
        const table = document.createElement("table");

        const headerRow = document.createElement("tr");
        const keys = Object.key(data[0]);

        key.forEach((key) => {
          const th = document.createElement("th");
          th.textContent = key.toUpperCase();
          headerRow.appendChild(th);
        });
        data.forEach((rowObject) => {
          const tr = document.createElement("tr");
          keys.forEach((key) => {
            const td = document.createElement("td");
            td.textContent = rowObject[key];
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        const container = document.getElementById(containerId);
        if (container) {
          container.appendChild(table);
        }
      };
      const myUsersData = [
        { name: "Sahil", age: 22, city: "Delhi" },
        { name: "Aman", age: 25, city: "Mumbai" },
        { name: "Rahul", age: 20, city: "Pune" },
      ];
      createTableFromData(myUsersData, "tableContainer");
