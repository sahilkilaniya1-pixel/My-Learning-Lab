<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab System Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .tabs-container {
            max-width: 500px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .tab-btn {
            width: 33.33%;
            float: left;
            padding: 12px 0;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .tab-btn:hover {
            background-color: #d6d6d6;
        }
    </style>
</head>
</html>
