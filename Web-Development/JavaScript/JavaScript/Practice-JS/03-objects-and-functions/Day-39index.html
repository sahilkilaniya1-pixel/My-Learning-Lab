<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab System Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f9;
      }
      .tabs-container {
        max-width: 500px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .tab-btn {
        width: 33.33%;
        float: left;
        padding: 12px 0;
        border: none;
        background-color: #e0e0e0;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
      }
      .tab-btn:hover {
        background-color: #d6d6d6;
      }
      .tab-btn.active {
        background-color: #007bff;
        color: white;
        font-weight: bold;
      }
      .button-wrapper::after {
        content: "";
        clear: both;
        display: table;
      }
      .tab-content {
        display: none; /* By default saare hidden rahenge */
        padding: 20px;
        font-size: 15px;
        line-height: 1.5;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h2>JavaScript Tab Navigation System</h2>
    <div class="tabs-container"></div>
    <div class="button-wrapper">
            <!-- 1st button par pehle se 'active' class hai -->
            <button class="tab-btn active">Home</button>
            <button class="tab-btn">Profile</button>
            <button class="tab-btn">Settings</button>
        </div>
        <div class="tab-content" style="display: block;">
            <h3>Home Page</h3>
            <p>Welcome to our Home section! Yahan aapko latest updates aur general info milegi.</p>
        </div>
        <div class="tab-content"></div>
            <h3>User Profile</h3>
            <p>Aapka Name: Sahil Kumar<br>Role: Frontend Developer<br>Location: India</p>
        </div>
        <div class="tab-content">
            
  </body>
</html>
