<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack | Professional Expense Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>📊 FinTrack Analytics</h1>
            <p>Track, filter, and optimize your financial modules.</p>
        </header>

        <section class="metrics-grid">
            <div class="metric-card income">
                <h3>Total Budget</h3>
                <p id="total-budget">$0.00</p>
            </div>
            <div class="metric-card expense">
                <h3>Total Spent</h3>
                <p id="total-spent">$0.00</p>
            </div>
            <div class="metric-card balance">
                <h3>Remaining Balance</h3>
                <p id="remaining-balance">$0.00</p>
            </div>
        </section>

        <main class="main-layout">
            <section class="form-panel">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="input-group">
                        <label for="text-desc">Description</label>
                        <input type="text" id="text-desc" placeholder="Salary, Rent, Groceries..." required>
                    </div>
                    <div class="input-group">
                        <label for="amount-val">Amount ($)</label>
                        <input type="number" step="0.01" id="amount-val" placeholder="Use negative (-) for expenses" required>
                    </div>
                    <button type="submit">Execute Transaction</button>
                </form>
            </section>

            <section class="ledger-panel">
                <div class="ledger-header">
                    <h2>Transaction Ledger</h2>
                    <select id="ledger-filter">
                        <option value="all">Show All</option>
                        <option value="income">Income Only</option>
                        <option value="expense">Expenses Only</option>
                    </select>
                </div>
                <ul id="ledger-list" class="ledger-list">
                    </ul>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
