<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events</title>
</head>
<body>

    <!-- =========================================================
         TOPIC 1: INLINE EVENTS (Old Approach)
         ========================================================= -->
    
    <!-- Example A: Direct inline alert -->
    <button onclick="alert('Inline click executed')">
      Direct Inline Click
    </button>

    <!-- Example B: Function call in HTML -->
    <button onclick="sayHello()">Function Call Inline Click</button>

    <script>
      function sayHello() {
        console.log("Hello! Function called via inline click.");
      }
    </script>

<!-- 
===================================================================
3 Disadvantages of Inline Clicks (Why Companies Avoid It):
===================================================================
1. Overriding Issue:
   You cannot easily execute multiple functions for a single event.
   If you add a second onclick attribute, the first one will be overridden.

2. Mixing HTML and JS (Messy Code):
   In large-scale applications (1000+ lines of code), finding and updating 
   onclick="" attributes inside HTML tags becomes extremely difficult to maintain.

3. Security Issues (CSP):
   Modern browsers enforce Content Security Policies (CSP) that block inline 
   JavaScript execution to prevent Cross-Site Scripting (XSS) attacks.
-->



    <!-- =========================================================
         TOPIC 2: PROBLEMATIC CODE (Property Assignment Overriding)
         ========================================================= -->

    <button id="overrideBtn">Click Me (Problematic Way)</button>

    <script>
      const overrideBtn = document.getElementById("overrideBtn");

      // Step 1: Assigned the first event handler
      overrideBtn.onclick = function () {
        alert("Action 1");
      };

      // Step 2: Assigned the second event handler (This overrides the first one)
      overrideBtn.onclick = function () {
        alert("Action 2");
      };
    </script>

<!-- 
===================================================================
Reason for the Bug:
===================================================================
1. Writing onclick="alert('Action 1')" sets an `onclick` property on the DOM element object.
2. When JS executes `btn.onclick = function() { alert('Action 2'); }`, 
   it overwrites the previously assigned function on that object property.
3. As a result, "Action 1" is deleted and clicking the button triggers 
   only "Action 2".
-->



    <!-- =========================================================
         TOPIC 3: MODERN BEST PRACTICE (addEventListener)
         ========================================================= -->

    <!-- Solution: Professional developers strictly separate HTML (Structure) and JS (Logic) -->
    <button id="myBtn">Click Me (Modern Way)</button>

    <script>
      // Step 1: Selected the element (Using # ID selector)
      const btn = document.querySelector("#myBtn");

      // Step 2: Attached Action 1
      btn.addEventListener("click", function () {
        alert("Action 1 Executed!");
      });

      // Step 3: Attached Action 2 (Both actions will execute sequentially)
      btn.addEventListener("click", function () {
        alert("Action 2 Executed!");
      });
    </script>

<!-- 
===================================================================
Why This Works (The Mechanism of Event Listener Registry/Queue)
===================================================================
addEventListener does not assign or overwrite a single object property. 
Instead, it maintains an internal "Event Listener Registry / Queue":

1. Adding the first listener registers it at Position 1 in the queue.
2. Adding the second listener pushes it to Position 2 in the queue.
3. Upon the trigger event (click), the browser iterates through the 
   queued functions sequentially in the order they were registered.

This allows both "Action 1" and "Action 2" to execute successfully without 
erasing each other!
-->



    <!-- =========================================================
         TOPIC 4: EVENT PROPAGATION (Bubbling vs Capturing)
         ========================================================= -->

<!-- 
Suppose you have 3 nested elements: Window -> Div -> Button.
When you click on the button, the click event travels in 2 distinct phases:

1. Capturing Phase (Top to Bottom):
   The event travels down from the outermost parent (Window) to the target element (Button).

2. Bubbling Phase (Bottom to Top - Default):
   Starting from the target element (Button), the event bubbles up towards 
   the outermost parent (Window) like bubbles in water.
-->

    <div id="parent" style="padding: 20px; background-color: antiquewhite">
      Parent Box
      <button id="child">Child Button</button>
    </div>

    <script>
      const parentElement = document.querySelector("#parent");
      const childElement = document.querySelector("#child");

      // Event Bubbling (Default behavior)
      childElement.addEventListener("click", () =>
        console.log("1. Child Clicked")
      );
      parentElement.addEventListener("click", () =>
        console.log("2. Parent Clicked")
      );

      /*
        Output when Child Button is clicked:
        1. Child Clicked
        2. Parent Clicked
      */
    </script>



    <!-- =========================================================
         TOPIC 5: EVENT DELEGATION (Smart Performance Strategy)
         ========================================================= -->

<!-- 
Imagine you have a To-Do List containing 1,000 items.

- Bad Approach: Attaching individual addEventListeners to all 1,000 <li> tags.
  This consumes excessive RAM and can crash browser performance.

- Smart Approach (Delegation): Attach a single listener to the parent <ul> element.
  Due to Event Bubbling, any click on an <li> will automatically bubble up to the <ul>.
-->

    <ul id="myList">
      <li>Task 1</li>
      <li>Task 2</li>
      <li>Task 3</li>
    </ul>

    <script>
      const list = document.querySelector("#myList");

      // Single listener on the parent element
      list.addEventListener("click", (e) => {
        // Verify that the actual clicked target is an <li> element
        if (e.target.tagName === "LI") {
          console.log("Clicked Item:", e.target.innerText);
        }
      });
    </script>



    <!-- =========================================================
         TOPIC 6: DEBOUNCING & THROTTLING (Optimization Techniques)
         ========================================================= -->

<!-- 
When users trigger high-frequency events rapidly (such as typing fast in a search input 
or continuously scrolling a page), we use optimization techniques to minimize server load 
and browser performance stress.

A. Debouncing (Execute only after a pause):
   Delays processing until user activity pauses. The event execution remains on hold 
   while typing continues. An API call or search executes only after 500ms of user inactivity.
-->

    <input type="text" id="searchInput" placeholder="Search here..." />

    <script>
      // Debounce Higher-Order Utility Function
      function debounce(fn, delay) {
        let timer;
        return function (...args) {
          clearTimeout(timer); // Cancel the previous pending timer
          timer = setTimeout(() => fn(...args), delay); // Set a new timer
        };
      }

      // Handler wrapped with a 500ms debounce delay
      const handleSearch = debounce((e) => {
        console.log("API call for:", e.target.value);
      }, 500);

      document
        .querySelector("#searchInput")
        .addEventListener("input", handleSearch);
    </script>

<!-- 
B. Throttling (Fixed Time Interval Execution):
   Instead of continuously firing events during rapid actions (like page scrolling or resizing), 
   Throttling guarantees the function executes at most once every fixed time interval (e.g., once every 200ms).
-->

    <script>
      // Throttle Higher-Order Utility Function
      function throttle(fn, limit) {
        let inThrottle = false;
        return function (...args) {
          if (!inThrottle) {
            fn(...args);
            inThrottle = true;
            setTimeout(() => (inThrottle = false), limit);
          }
        };
      }

      // Example Scroll Handler throttled to run every 200ms
      window.addEventListener(
        "scroll",
        throttle(() => {
          console.log("Scroll event triggered at fixed intervals!");
        }, 200)
      );
    </script>



    <!-- =========================================================
         TOPIC 7: CUSTOM EVENTS (Creating Your Own Events)
         ========================================================= -->

<!-- 
In addition to JavaScript's built-in DOM events (click, submit, input), 
you can create and dispatch your own Custom Events—for instance, when triggering a app notification or user login.
-->

    <script>
      // Step 1: Create a Custom Event instance with attached custom data payload (detail)
      const myEvent = new CustomEvent("userLoggedIn", {
        detail: { username: "Rahul", role: "Admin" },
      });

      // Step 2: Listen for the custom event anywhere on the DOM
      document.addEventListener("userLoggedIn", (e) => {
        console.log(`Welcome ${e.detail.username}! Role: ${e.detail.role}`);
      });

      // Step 3: Programmatically trigger/dispatch the custom event
      document.dispatchEvent(myEvent);
    </script>

</body>
</html>
