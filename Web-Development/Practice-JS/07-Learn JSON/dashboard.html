<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dashboard</title>
</head>
<body>

<div class="header">
    <h2 id="welcomeText">Welcome</h2>
    <button class="logout-btn" id="logoutBtn">Logout</button>
</div>

<h3>Add Daily Entry</h3>
<form id="entryForm">
    <label for="date">Date:</label><br>
    <input type="date" id="date" required><br><br>

    <label for="entry">Notes/Activity:</label><br>
    <textarea id="entry" rows="3" style="width: 100%;" required></textarea><br><br>

    <button type="submit" style="padding: 8px 15px;">Save Record</button>
</form>

<hr style="margin: 30px 0;">

<h3>Your Saved Records</h3>
<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Notes</th>
        </tr>
    </thead>
    <tbody id="recordsBody"></tbody>
</table>

<script>
    // Security check: If not logged in, redirect to login page
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('welcomeText').innerText = `Welcome, ${currentUser.name || currentUser.email}`;
    }

    // Load User Records
    function loadRecords() {
        const allRecords = JSON.parse(localStorage.getItem('userRecords')) || {};
        const myRecords = allRecords[currentUser.email] || [];
        const tableBody = document.getElementById('recordsBody');
        
        tableBody.innerHTML = '';
        if (myRecords.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2">No entries yet.</td></tr>';
        } else {
            myRecords.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${item.date}</td><td>${item.content}</td>`;
                tableBody.appendChild(row);
            });
        }
    }

    // Save Entry Action
    document.getElementById('entryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const date = document.getElementById('date').value;
        const content = document.getElementById('entry').value;

        const allRecords = JSON.parse(localStorage.getItem('userRecords')) || {};
        if (!allRecords[currentUser.email]) {
            allRecords[currentUser.email] = [];
        }

        allRecords[currentUser.email].push({ date, content });
        localStorage.setItem('userRecords', JSON.stringify(allRecords));

        document.getElementById('entryForm').reset();
        loadRecords();
    });

    // Logout Action
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    });

    // Initial load
    loadRecords();
</script>

</body>
</html>
