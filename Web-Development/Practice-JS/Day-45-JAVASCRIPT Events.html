<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events Topic</title>
  </head>
  <body>
    <button onclick="alert('inline click ho gaya')">Direct Inline Click</button>

    <!-- Example B: Function call in html -->
    <button onclick="sayHello()">Function Call inline Click</button>
    <script>
      function sayHello() {
        console.log("Hello function call hua inclne click se.");
      }
    </script>
  </body>
</html>
<!-- 
Inline click 3 disadvantages: (why companies Avoid it)
1.Ek Event par sirf aap ek sath multiple functions easily
run nahi kar sakte. Agar aap doosra onclick lagayenge, toh phela override hojayega

2.HTML Aur JS ka Mix Ho jana (Messy Code)
Jab aapka project bada hoga (1000+ lines of code), toh har HTML tag mein onclick="" dhoondhna aur change karna bohot muskil ho jayega.

3.Security (CSP Issues)
Modern browsers mein security Policies (CSP) hoti hain jo inline javascript ko block kar deti hain taaki hackers malicious script execute na kar sakein.

-->
<!--  
Best Practice: Modern Standard (addEventListener)
Professional developers hamesha HTML (Strecutre) aur JS (Logic ) ko alag rakhte hain:

-->
<!doctype html> -->
<html lang="en">
  <body>
    <button id="myBtn">Click Me(Modern Way)</button>
    <script>
      //Step1: Element ko Select kiya
      const btn = document.querySelector("myBtn");

      //Step2: Event Listener lagaya
      btn.addEventListener("click", function () {
        console.log("Modern way click ho gaya");
      });
    </script>
  </body>
</html>
