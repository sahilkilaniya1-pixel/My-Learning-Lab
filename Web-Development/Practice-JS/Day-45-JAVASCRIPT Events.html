<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events</title>
  </head>
  <body>
    <!-- =========================================================
         TOPIC 1: INLINE EVENTS (Old Approach)
         ========================================================= -->

    <!-- Example A: Direct inline alert -->
    <button onclick="alert('Inline click executed')">
      Direct Inline Click
    </button>

    <!-- Example B: Function call in HTML -->
    <button onclick="sayHello()">Function Call Inline Click</button>

    <script>
      function sayHello() {
        console.log("Hello! Function called via inline click.");
      }
    </script>

    <!-- 
===================================================================
3 Disadvantages of Inline Clicks (Why Companies Avoid It):
===================================================================
1. Overriding Issue:
   You cannot easily execute multiple functions for a single event.
   If you add a second onclick attribute, the first one will be overridden.

2. Mixing HTML and JS (Messy Code):
   In large-scale applications (1000+ lines of code), finding and updating 
   onclick="" attributes inside HTML tags becomes extremely difficult to maintain.

3. Security Issues (CSP):
   Modern browsers enforce Content Security Policies (CSP) that block inline 
   JavaScript execution to prevent Cross-Site Scripting (XSS) attacks.
-->

    <!-- =========================================================
         TOPIC 2: PROBLEMATIC CODE (Property Assignment Overriding)
         ========================================================= -->

    <button id="overrideBtn">Click Me (Problematic Way)</button>

    <script>
      const overrideBtn = document.getElementById("overrideBtn");

      // Step 1: Assigned the first event handler
      overrideBtn.onclick = function () {
        alert("Action 1");
      };

      // Step 2: Assigned the second event handler (This overrides the first one)
      overrideBtn.onclick = function () {
        alert("Action 2");
      };
    </script>

    <!-- 
===================================================================
Reason for the Bug:
===================================================================
1. Writing onclick="alert('Action 1')" sets an `onclick` property on the DOM element object.
2. When JS executes `btn.onclick = function() { alert('Action 2'); }`, 
   it overwrites the previously assigned function on that object property.
3. As a result, "Action 1" is deleted and clicking the button triggers 
   only "Action 2".
-->

    <!-- =========================================================
         TOPIC 3: MODERN BEST PRACTICE (addEventListener)
         ========================================================= -->

    <!-- Solution: Professional developers strictly separate HTML (Structure) and JS (Logic) -->
    <button id="myBtn">Click Me (Modern Way)</button>

    <script>
      // Step 1: Selected the element (Using # ID selector)
      const btn = document.querySelector("#myBtn");

      // Step 2: Attached Action 1
      btn.addEventListener("click", function () {
        alert("Action 1 Executed!");
      });

      // Step 3: Attached Action 2 (Both actions will execute sequentially)
      btn.addEventListener("click", function () {
        alert("Action 2 Executed!");
      });
    </script>

    <!-- 
===================================================================
Why This Works (The Mechanism of Event Listener Registry/Queue)
===================================================================
addEventListener does not assign or overwrite a single object property. 
Instead, it maintains an internal "Event Listener Registry / Queue":

1. Adding the first listener registers it at Position 1 in the queue.
2. Adding the second listener pushes it to Position 2 in the queue.
3. Upon the trigger event (click), the browser iterates through the 
   queued functions sequentially in the order they were registered.

This allows both "Action 1" and "Action 2" to execute successfully without 
erasing each other!
-->

    <!-- Event Propagation (Bubbling vs Capturing) 
Maan lijiye aapke pass 3 nested boxes hain: Window -> Div -> Button . Jab aap button par click karte hain, toh click event 2 alag phases mein travel karta hain.
:: Capturing Phase (Upar se Niche): Event Sabse bahar wale parent (window) se niche Button tak aata hain
:: Bubbling Phase (Niche se Upar - Defalut): Event Button se shuru hokar upar ki taraf paani ke bubbles ki tarah window tak jata hain.
-->
    <div id="parent" style="padding: 20px; background-color: antiquewhite">
      Parent Box
      <button id="child">Child button</button>
    </div>

    <script>
      const parent = document.querySelector("#parent");
      const child = document.querySelector("#child");

      //Event Bubbling (Default)
      child.addEventListener("click", () => console.log("1. Child Clicked"));
      child.addEventListener("Click", () => console.log("2.Parent Clicked"));

      //Output Jab Child Click hoga:
      // 1.Child Clicked
      // 2.Parent Clicked
    </script>
    <!-- 
    2.Event Delegation (Smart Performance Strategy)
    Maan lijiye aapke pass ek To-Do-List hai jisme 1,000 items hain.
:: Bura Tarika: sabhi 1,000 <li> tags par alag- alag addEventListner lagana. Isse Browser ki Memory crash ho sakti hain.
:: Smart Tarika (Delegation): Listner sirf main parent <ul> par lagayein. Bubbling ki wajah se <li> ka click <ul> tak pahunch jayega.
-->
  <ul id="Mylist">
    <li>Task 1</li>
    <li>Task 2</li>
    <li>Task 3</li>
  </ul>
  <script>
    const list = document.querySelector('#Mylist');
    //Listner sirf parent <ul> par hai.
      list.addEventListener('click',(e) => {
          //Check karein ki click kis item par hua hain
          if (e.target.tagName === 'LI') {
            console.log('Clicked Item:', e.target.innerText);
          }
      });
  </script>
<!-- 
 Debouncing & Throttling (Optimization Techniques)
 
-->
  </body>
</html>
