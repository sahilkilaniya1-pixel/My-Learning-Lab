<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbulb Toggle</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            direction: center;
            justify-content: center;
            min-height: 100vh ;
            gap: 20 ;
            background-color: white;
        }
        .bulb {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: #d1d5db;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }
    </style>
    <button class="btn" id="toggleBtn" aria-pressed="false">Turn On</button>
    <script>
      const bulb = document.getElementById('bulb');
      const toggleBtn = document.getElementById('toggleBtn');
      let isBulbOn = false;
      function updateBulbUI() {
        bulb.dataset.active = isBulbOn;
        toggleBtn.setAttribute('aria-pressed', isBulbOn);
        toggleBtn.textContent = isBulbOn ? 'Turn Off' : 'Turn On';
      }
      toggleBtn.addEventListener('click', () => {
        isBulbOn = !isBulbOn;
        updateBulbUI();
      });
    </script>
  </body>
</html>
