<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbulb Toggle</title>
    <style>
        body{
            
        }
    </style>
    <script>
      const bulb = document.getElementById('bulb');
      const toggleBtn = document.getElementById('toggleBtn');
      let isBulbOn = false;
      function updateBulbUI() {
        bulb.dataset.active = isBulbOn;
        toggleBtn.setAttribute('aria-pressed', isBulbOn);
        toggleBtn.textContent = isBulbOn ? 'Turn Off' : 'Turn On';
      }
      toggleBtn.addEventListener('click', () => {
        isBulbOn = !isBulbOn;
        updateBulbUI();
      });
    </script>
  </body>
</html>
