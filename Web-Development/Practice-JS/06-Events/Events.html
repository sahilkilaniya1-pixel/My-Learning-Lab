<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events Practice - My Learning Lab</title>
    
    <style>
        body {
            background-color: black;
            color: aliceblue;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Flex Utility for Nested Boxes */
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        /* Grandparent, Parent, Child Elements */
        #grandparent {
            height: 300px;
            width: 300px;
            background-color: aqua;
            color: black;
        }

        #parent {
            height: 200px;
            width: 200px;
            background-color: white;
            color: black;
        }

        #child {
            height: 100px;
            width: 100px;
            background-color: blue;
            color: white;
        }

        /* Optional Children List Container */
        .child-box {
            height: 100px;
            width: 100px;
            margin: 10px;
            color: white;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: Single Heading Target -->
    <h1 id="first">Hello Coder</h1>

    <!-- SECTION 2: Event Propagation / Bubbling Sandbox -->
    <div id="grandparent" class="flex-center">
        Grandparent
        <div id="parent" class="flex-center">
            Parent
            <div id="child" class="flex-center">
                Child
            </div>
        </div>
    </div>

    <!-- Script File Linked at Bottom -->
    <script src="index.js"></script>
</body>
</html>
